<pnx-modal-msg
  [bDisplayModal]="deleteModal"
  *ngIf="object"
>
  <h2>{{ 'Monitoring.DeletingPopup.Warning' | translate }}</h2>
  <p>
    {{ 'Monitoring.DeletingPopup.WarningDelete' | translate }}
  </p>
  <button
    class="btn btn-danger float-right"
    (click)="confirmDelete.emit()"
  >
    <span
      [ngClass]="{ 'hide-spinner': !deleteSpinner }"
      class="spinner-border spinner-border-sm"
      role="status"
      aria-hidden="true"
    ></span>
    {{ 'Monitoring.DeletingPopup.ConfirmDelete' | translate }}
  </button>
  <button
    class="btn btn-primary"
    (click)="deleteModalChange.emit(false)"
  >
    {{ 'Monitoring.DeletingPopup.Cancel' | translate }}
  </button>
</pnx-modal-msg>

<div>
  <div
    id="properties-form"
    class="cadre"
    *ngIf="formsDefinition"
  >
    <div style="height: 25px">
      <span
        *ngIf="!object && config['chained']"
        id="toggle-btn"
        class="float-right"
        matTooltip="Enchainer les saisies"
        matTooltipPosition="left"
      >
        <i
          class="fa fa-repeat"
          aria-hidden="true"
        ></i>
        <mat-slide-toggle
          color="primary"
          [ngModel]="chainInput"
          (ngModelChange)="chainInputChange.emit($event)"
        ></mat-slide-toggle>
      </span>
    </div>
    <form [formGroup]="form">
      <p
        class="alert alert-warning"
        style="display: inline-block"
        *ngIf="config['geometry_type'] && !form.value.geometry && objectType != 'sites_group'"
      >
        <span>{{ 'Monitoring.Form.PickGeom' | translate }}</span>
      </p>
      <p
        class="alert alert-warning"
        style="display: inline-block; padding: 4px"
        *ngIf="config['geometry_type'] && !form.value.geometry && objectType == 'sites_group'"
      >
        <span>
          {{ 'Monitoring.Form.GrpSiteGeom' | translate }}
        </span>
      </p>

      <!-- composant choix de site select + filtre -->
      <div
        [ngClass]="{
          'form-scroll-info-geom': config['geometry_type'] && !form.value.geometry,
          'form-scroll': !(config['geometry_type'] && !form.value.geometry)
        }"
      >
        <ng-content></ng-content>
      </div>
      <div class="btn-child">
        <button
          mat-raised-button
          color="primary"
          *ngIf="!chainInput && !object && config.children && addChildren"
          class="btn btn-success float-right mr-1"
          [matTooltip]="canUpdate ? null : toolTipNotAllowed"
          (click)="canUpdate ? submitForm.emit(true) : notAllowed.emit()"
          [disabled]="!form.valid"
        >
          <span
            [ngClass]="{ 'hide-spinner': !saveAndAddChildrenSpinner }"
            class="spinner-border spinner-border-sm float-right"
            role="status"
            aria-hidden="true"
          ></span>

          <span>{{ 'Monitoring.Form.ValidateEnter' | translate }}{{ config.children[0] }}</span>
        </button>
        <button
          mat-raised-button
          color="primary"
          class="float-right mr-1"
          [matTooltip]="canUpdate ? null : toolTipNotAllowed"
          (click)="canUpdate ? submitForm.emit(false) : notAllowed.emit()"
          [disabled]="!form.valid"
        >
          <span
            [ngClass]="{ 'hide-spinner': !saveSpinner }"
            class="spinner-border spinner-border-sm float-right"
            role="status"
            aria-hidden="true"
          ></span>

          <span *ngIf="chainInput && !object">
            {{ 'Monitoring.Form.ValidateChain' | translate }}
          </span>
          <span *ngIf="!chainInput || object">{{ 'Monitoring.Form.Validate' | translate }}</span>
        </button>

        <button
          mat-raised-button
          color="warn"
          class="float-left"
          (click)="cancelEdit.emit()"
        >
          {{ 'Monitoring.Form.Cancel' | translate }}
        </button>
        <button
          mat-raised-button
          [matTooltip]="canDelete ? null : toolTipNotAllowed"
          [disabled]="!canDelete"
          color="warn"
          class="float-left"
          (click)="canDelete ? deleteModalChange.emit(true) : null"
          *ngIf="object"
        >
          {{ 'Monitoring.Form.Delete' | translate }}
        </button>
      </div>
    </form>
  </div>
</div>
