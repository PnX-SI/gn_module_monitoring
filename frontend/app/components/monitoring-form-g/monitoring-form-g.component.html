<pnx-monitoring-form-g-layout
  [formsDefinition]="formsDefinition"
  [object]="object"
  [config]="config"
  [objectType]="objectType"
  [form]="form"
  [chainInput]="chainInput"
  [chainedCount]="chainedCount"
  (chainInputChange)="chainInput = $event"
  [saveSpinner]="saveSpinner"
  [formReady]="formReady"
  [saveAndAddChildrenSpinner]="saveAndAddChildrenSpinner"
  [canUpdate]="canUpdate"
  [canDelete]="canDelete"
  [toolTipNotAllowed]="toolTipNotAllowed"
  [addChildren]="addChildren"
  [deleteSpinner]="deleteSpinner"
  [deleteModal]="deleteModal"
  (deleteModalChange)="deleteModal = $event"
  (submitForm)="onSubmit($event)"
  (notAllowed)="notAllowedMessage()"
  (cancelEdit)="onCancelEdit()"
  (stopChain)="onStopChain()"
  (confirmDelete)="onDelete()"
>
  <pnx-dynamic-form-generator
    class="obj-form"
    #dynamicForm
    [autoGenerated]="true"
    [myFormGroup]="form"
    [preserveControls]="true"
    [formsDefinition]="formsDefinition"
    (myFormGroupChange)="onDynamicFormGroupChange()"
    (change)="onFormValueChange($event)"
  ></pnx-dynamic-form-generator>
</pnx-monitoring-form-g-layout>
