[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gn_module_monitoring"
dynamic = ["version"]
dependencies = ["geonature>=2.18.0", "jsonschema"]
description = "Module pour générer de façon générique des interfaces de saisie correspondant à des protocoles de suivi"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
maintainers = [
    { name = "Parcs nationaux des Écrins et des Cévennes", email = "geonature@ecrins-parcnational.fr" },
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/PnX-SI/gn_module_monitoring"

[project.entry-points.gn_module]
code = "gn_module_monitoring:MODULE_CODE"
picto = "gn_module_monitoring:MODULE_PICTO"
blueprint = "gn_module_monitoring.blueprint:blueprint"
config_schema = "gn_module_monitoring.conf_schema_toml:GnModuleSchemaConf"
migrations = "gn_module_monitoring:migrations"

[tool.setuptools]
package-dir = { "" = "backend" }
zip-safe = false

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
"gn_module_monitoring.config" = ["generic/*.json"]
"gn_module_monitoring.migrations" = ["data/*.sql"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["backend"]

[tool.coverage.run]
source = ["backend/gn_module_monitoring"]
omit = ["*/tests/*", "*/migrations/*", "conftest.py"]

[tool.black]
line-length = 99
